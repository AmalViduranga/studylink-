# ==============================================================================
# StudyLink Example Configuration (SRS Baseline v1.0)
# Copy to config/studylink.properties for local development or classroom demos.
# Keep real LAN IP addresses, keystores, private keys and passwords local.
# ==============================================================================

# Host identity and bind/target address (use 127.0.0.1 for single-machine starter checks)
server.id=studylink-local
server.host=127.0.0.1
network.interface=loopback

# Five configurable feature ports (SRS Section 3 & Section 6.3)
# M2 Discovery & Presence (UDP broadcast discovery + unicast heartbeat/roster)
port.discovery=45400
# M1 Room Sessions & Membership (Blocking TCP length-prefixed JSON control)
port.rooms=45401
# M5 Live Room Chat (Java NIO non-blocking channels + Selector over TCP)
port.chat=45402
# M3 Concurrent File Transfers (TCP bounded worker pool for PDF/TXT + SHA-256)
port.files=45403
# M4 Private Notes to Host (TLS 1.3 over TCP via JSSE to local host inbox)
port.notes=45404

# Durable host file storage and local PKCS12 TLS stores (SRS Section 4.1)
# Passwords come from STUDYLINK_KEYSTORE_PASSWORD and STUDYLINK_TRUSTSTORE_PASSWORD.
data.dir=var/room-files
tls.protocol=TLSv1.3
tls.serverStore=local/host.p12
tls.clientTrustStore=local/host-trust.p12

# Predefined classroom study rooms (SRS Section 1 & Section 6.4)
rooms.catalog=netprog:Network Programming,revision:Exam Revision,workshop:Project Workshop

# Protocol and resource limits (SRS Section 6.2 - 6.4)
limits.maxFrameBytes=16384
limits.maxUdpBytes=1200
limits.maxChatTextBytes=2048
limits.maxNoteTextBytes=2048
limits.maxFileSizeBytes=5242880
limits.fileWorkerThreads=4
limits.fileQueueCapacity=8
limits.maxSlowClientQueueBytes=65536
limits.maxInboxNotesPerRoom=100
limits.maxFilesPerRoom=25

# Session, discovery and presence timeouts in milliseconds (SRS Section 5 & 6.2)
timeouts.discoveryMs=3000
timeouts.heartbeatIntervalMs=3000
timeouts.presenceExpiryMs=10000
timeouts.presenceHideMs=12000
timeouts.controlPingIntervalMs=5000
timeouts.controlSessionExpiryMs=20000
